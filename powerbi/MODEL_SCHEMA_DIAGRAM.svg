<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 580" width="1060" height="580">
  <rect width="1060" height="580" fill="#0B1220"/>
  <text x="32" y="42" fill="#F1F5F9" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">Power BI Semantic Star Schema — Customer Churn Intelligence</text>
  <text x="32" y="66" fill="#ACBBD0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Single-direction 1:* relationships from Dimensions to Fact tables (Import or SQL Server DirectQuery)</text>

  <!-- Connector lines -->
  <line x1="275" y1="165" x2="385" y2="230" stroke="#5EE0B5" stroke-width="2"/>
  <line x1="275" y1="365" x2="385" y2="300" stroke="#5EE0B5" stroke-width="2"/>
  <line x1="785" y1="165" x2="675" y2="230" stroke="#5EE0B5" stroke-width="2"/>
  <line x1="785" y1="365" x2="675" y2="300" stroke="#5EE0B5" stroke-width="2"/>
  <line x1="275" y1="185" x2="385" y2="475" stroke="#8AB4F8" stroke-width="1.8" stroke-dasharray="5,4"/>

  <!-- dim_customer -->
  <rect x="35" y="100" width="240" height="145" rx="8" fill="#141F30" stroke="#304158" stroke-width="1.5"/>
  <rect x="35" y="100" width="240" height="32" rx="8" fill="#1E2D45"/>
  <text x="48" y="121" fill="#5EE0B5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">bi.dim_customer (1)</text>
  <text x="48" y="150" fill="#F1F5F9" font-family="Consolas, monospace" font-size="11.5">PK customer_sk</text>
  <text x="48" y="170" fill="#ACBBD0" font-family="Consolas, monospace" font-size="11">UK synthetic_customer_id</text>
  <text x="48" y="190" fill="#ACBBD0" font-family="Consolas, monospace" font-size="11">   tenure_months / cohort</text>
  <text x="48" y="210" fill="#ACBBD0" font-family="Consolas, monospace" font-size="11">   senior_segment / partner</text>
  <text x="48" y="230" fill="#ACBBD0" font-family="Consolas, monospace" font-size="11">   has_dependents / gender</text>

  <!-- dim_contract_billing -->
  <rect x="35" y="295" width="240" height="140" rx="8" fill="#141F30" stroke="#304158" stroke-width="1.5"/>
  <rect x="35" y="295" width="240" height="32" rx="8" fill="#1E2D45"/>
  <text x="48" y="316" fill="#5EE0B5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">bi.dim_contract_billing (1)</text>
  <text x="48" y="345" fill="#F1F5F9" font-family="Consolas, monospace" font-size="11.5">PK contract_billing_key</text>
  <text x="48" y="365" fill="#ACBBD0" font-family="Consolas, monospace" font-size="11">   contract_type</text>
  <text x="48" y="385" fill="#ACBBD0" font-family="Consolas, monospace" font-size="11">   payment_method</text>
  <text x="48" y="405" fill="#ACBBD0" font-family="Consolas, monospace" font-size="11">   billing_delivery</text>
  <text x="48" y="423" fill="#ACBBD0" font-family="Consolas, monospace" font-size="11">   payment_automation</text>

  <!-- fact_customer_churn_scoring -->
  <rect x="385" y="135" width="290" height="255" rx="8" fill="#141F30" stroke="#5EE0B5" stroke-width="2"/>
  <rect x="385" y="135" width="290" height="34" rx="8" fill="#1E2D45"/>
  <text x="400" y="157" fill="#5EE0B5" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="bold">bi.fact_customer_churn_scoring (*)</text>
  <text x="400" y="186" fill="#F1F5F9" font-family="Consolas, monospace" font-size="11.5">FK customer_sk / synthetic_id</text>
  <text x="400" y="206" fill="#F1F5F9" font-family="Consolas, monospace" font-size="11.5">FK contract_billing_key</text>
  <text x="400" y="226" fill="#F1F5F9" font-family="Consolas, monospace" font-size="11.5">FK service_bundle_key</text>
  <text x="400" y="246" fill="#F1F5F9" font-family="Consolas, monospace" font-size="11.5">FK risk_band_key</text>
  <text x="400" y="270" fill="#8AB4F8" font-family="Consolas, monospace" font-size="11">M  observed_churn_flag</text>
  <text x="400" y="290" fill="#8AB4F8" font-family="Consolas, monospace" font-size="11">M  churn_probability (Calib.)</text>
  <text x="400" y="310" fill="#8AB4F8" font-family="Consolas, monospace" font-size="11">M  monthly_charges_usd</text>
  <text x="400" y="330" fill="#8AB4F8" font-family="Consolas, monospace" font-size="11">M  monthly_charges_at_risk_proxy</text>
  <text x="400" y="350" fill="#8AB4F8" font-family="Consolas, monospace" font-size="11">M  expected_monthly_exposure</text>
  <text x="400" y="370" fill="#ACBBD0" font-family="Consolas, monospace" font-size="11">A  reason_code_1..3 / split</text>

  <!-- dim_service_bundle -->
  <rect x="785" y="100" width="240" height="145" rx="8" fill="#141F30" stroke="#304158" stroke-width="1.5"/>
  <rect x="785" y="100" width="240" height="32" rx="8" fill="#1E2D45"/>
  <text x="798" y="121" fill="#5EE0B5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">bi.dim_service_bundle (1)</text>
  <text x="798" y="150" fill="#F1F5F9" font-family="Consolas, monospace" font-size="11.5">PK service_bundle_key</text>
  <text x="798" y="170" fill="#ACBBD0" font-family="Consolas, monospace" font-size="11">   internet_service</text>
  <text x="798" y="190" fill="#ACBBD0" font-family="Consolas, monospace" font-size="11">   online_security / support</text>
  <text x="798" y="210" fill="#ACBBD0" font-family="Consolas, monospace" font-size="11">   protection_support_count</text>
  <text x="798" y="230" fill="#ACBBD0" font-family="Consolas, monospace" font-size="11">   active_addon_count</text>

  <!-- dim_risk_band -->
  <rect x="785" y="295" width="240" height="140" rx="8" fill="#141F30" stroke="#304158" stroke-width="1.5"/>
  <rect x="785" y="295" width="240" height="32" rx="8" fill="#1E2D45"/>
  <text x="798" y="316" fill="#5EE0B5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">bi.dim_risk_band (1)</text>
  <text x="798" y="345" fill="#F1F5F9" font-family="Consolas, monospace" font-size="11.5">PK risk_band_key</text>
  <text x="798" y="365" fill="#ACBBD0" font-family="Consolas, monospace" font-size="11">   risk_band (Sort: sort_order)</text>
  <text x="798" y="385" fill="#ACBBD0" font-family="Consolas, monospace" font-size="11">   probability_band_desc</text>
  <text x="798" y="405" fill="#ACBBD0" font-family="Consolas, monospace" font-size="11">   sla_guidance</text>

  <!-- Action Queue + Governance Standalone Tables -->
  <rect x="385" y="425" width="290" height="125" rx="8" fill="#141F30" stroke="#8AB4F8" stroke-width="1.6"/>
  <rect x="385" y="425" width="290" height="30" rx="8" fill="#1E2D45"/>
  <text x="400" y="445" fill="#8AB4F8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">fact_retention_action_queue (*)</text>
  <text x="400" y="472" fill="#F1F5F9" font-family="Consolas, monospace" font-size="11">FK synthetic_customer_id (1:0..1)</text>
  <text x="400" y="492" fill="#ACBBD0" font-family="Consolas, monospace" font-size="11">   priority_rank / priority_tier</text>
  <text x="400" y="512" fill="#ACBBD0" font-family="Consolas, monospace" font-size="11">   recommended_playbook (Hypothesis)</text>
  <text x="400" y="532" fill="#ACBBD0" font-family="Consolas, monospace" font-size="11">   outreach_status / contact_outcome</text>

  <rect x="785" y="455" width="240" height="95" rx="8" fill="#141F30" stroke="#304158" stroke-width="1.5"/>
  <text x="798" y="480" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">Governance Disconnected Tables</text>
  <text x="798" y="505" fill="#ACBBD0" font-family="Consolas, monospace" font-size="11">- fact_model_evaluation (18 rows)</text>
  <text x="798" y="527" fill="#ACBBD0" font-family="Consolas, monospace" font-size="11">- fact_data_quality_audit (6 rows)</text>
</svg>
